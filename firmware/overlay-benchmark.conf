# Combine with exactly one classifier overlay using EXTRA_CONF_FILE.
CONFIG_CLASSIFIER_BENCHMARK_MODE=y
CONFIG_CLASSIFIER_DEBUG_STREAM=n

# Eliminate measurement contamination from logs, shell, and console traffic.
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_I2C_SHELL=n
CONFIG_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

# Tickless idle lets Zephyr enter the board-supported System ON idle state
# whenever all inference threads block. CONFIG_PM is not supported by this
# nRF54L15 board configuration and must not be forced here.
CONFIG_TICKLESS_KERNEL=y
